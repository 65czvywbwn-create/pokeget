# =====================================================================
#  pokeget : configuration
#  ---------------------------------------------------------------------
#  Ce fichier est un MODÈLE. La commande « python3 -m pokeget init »
#  le copie dans config.yaml en générant tes topics ntfy secrets.
#  C'est config.yaml que tu modifies ensuite (il n'est jamais envoyé
#  sur GitHub).
#
#  Règles YAML à connaître :
#   - l'indentation (les espaces en début de ligne) compte : utilise
#     des espaces, jamais de tabulations ;
#   - « # » commence un commentaire, ignoré par le programme ;
#   - mets les textes entre guillemets "comme ceci".
#  Après une modification, redémarre le script (voir README).
# =====================================================================

# --- Notifications iPhone (application ntfy) ---------------------------
ntfy:
  serveur: "https://ntfy.sh"
  # Topic secret sur lequel tu reçois les alertes. Abonne-toi à ce nom
  # exact dans l'app ntfy. Ne le partage pas : quiconque le connaît peut
  # lire tes alertes.
  topic: "REMPLACE_PAR_INIT"
  # Second topic secret utilisé en interne par le bouton
  # « Couper ce produit 1 h ». Tu n'as PAS besoin de t'y abonner.
  topic_controle: "REMPLACE_PAR_INIT_CTL"

# --- Comportement des alertes ------------------------------------------
alertes:
  # Alerter aussi quand une précommande s'ouvre (true = oui, false = non)
  precommande: true
  # Délai minimum entre deux alertes pour un même produit (anti-spam si
  # un site hésite entre « dispo » et « rupture »)
  delai_min_entre_alertes_minutes: 10
  # Heure du résumé quotidien « toujours actif »
  heure_resume_quotidien: "09:00"
  # Au bout de combien de minutes de blocage (403, 429, captcha) un site
  # déclenche une alerte « site bloqué »
  alerte_site_bloque_apres_minutes: 15

# --- Produits recherchés -------------------------------------------------
produits:
  # Mots-clés à INCLURE : un produit est retenu si son nom contient au
  # moins un de ces mots-clés. Majuscules, accents et apostrophes sont
  # ignorés (« Dresseur d’Élite » = « dresseur d'elite »).
  # prix_max : prix maximum en euros pour ce mot-clé (supprime la ligne
  # prix_max pour ne pas mettre de limite).
  inclure:
    - mot: "30e anniversaire"
      prix_max: 90
    - mot: "30 ans"
      prix_max: 90
    - mot: "dresseur d'élite"
      prix_max: 70

  # Mots-clés à EXCLURE : un produit dont le nom contient un de ces mots
  # est ignoré, même s'il contient un mot-clé à inclure.
  exclure:
    - "occasion"
    - "descellée"
    - "abîmée"
    - "sleeve"
    - "protège-cartes"
    - "classeur"
    - "portfolio"

  # Le nom du produit doit AUSSI contenir au moins un de ces mots
  # (évite par ex. « Le Livre des 30 ans du Club Dorothée »).
  # Mets [] pour désactiver. Chaque site peut avoir sa propre valeur.
  doit_contenir: ["pokemon"]

# --- Marketplaces (Auchan, Leclerc, Cultura, Carrefour) ------------------
marketplace:
  # true : n'alerter que si le vendeur est l'enseigne elle-même,
  # jamais un revendeur tiers (souvent bien plus cher).
  vendeur_officiel_uniquement: true

# --- Sites surveillés -----------------------------------------------------
#  Chaque site a :
#   nom        : le nom affiché dans les alertes
#   type       : le module (« adapter ») qui sait lire ce site
#   actif      : true pour surveiller, false pour mettre en pause
#   intervalle : secondes entre deux vérifications (±20 % aléatoire).
#                Sans cette ligne, une valeur par défaut raisonnable
#                est utilisée (Shopify 20 s, grandes enseignes 50 s,
#                Amazon 75 s).
sites:

  # ----- Boutiques Shopify (type: shopify) -----
  # Il suffit du nom de domaine. Vérifie d'abord qu'une boutique est bien
  # sur Shopify avec : python3 -m pokeget verifier https://le-domaine.fr
  # Optionnel :
  #   collection: "pokemon"   -> ne lire que cette collection (grosses boutiques)
  #   pages_max: 4            -> nombre de pages de 250 produits à parcourir
  #   doit_contenir: []       -> boutique 100 % Pokémon : pas besoin du mot « pokemon »
  - nom: "Monpokestore"
    type: shopify
    domaine: "www.monpokestore.fr"
    actif: true
    doit_contenir: []

  # ----- Grandes enseignes (un type dédié par enseigne) -----
  # Par défaut, le script lance une recherche « pokemon + mot-clé » pour
  # chaque mot-clé de « inclure ». Options communes :
  #   recherches: ["pokemon etb"]   -> remplace ces recherches par défaut
  #   fiches:                       -> fiches produit surveillées à chaque
  #     - "https://..."                tour, même sans mot-clé correspondant

  # Monoprix : livraison seulement dans certaines villes (vérifie ton
  # adresse sur courses.monoprix.fr). Une recherche « pokemon » par tour
  # suffit : le rayon compte une dizaine de produits.
  - nom: "Monoprix"
    type: monoprix
    domaine: "courses.monoprix.fr"
    actif: true
    intervalle: 45

  # Auchan : aussi une marketplace. Avec vendeur_officiel_uniquement: true,
  # seules les offres « Vendu par Auchan » déclenchent une alerte.
  # retrait_magasin: true -> compte aussi les offres « retrait en magasin »
  # (leur stock dépend du magasin choisi sur le site : moins fiable).
  - nom: "Auchan"
    type: auchan
    domaine: "www.auchan.fr"
    actif: true
    retrait_magasin: false

  # Leclerc : aussi une marketplace (« Vendu par E.Leclerc » ou revendeur).
  # Les produits « Vérifier la disponibilité » ne sont qu'en magasin.
  - nom: "Leclerc"
    type: leclerc
    domaine: "www.e.leclerc"
    actif: true

  # Philibert : le stock de chaque produit intéressant est lu séparément
  # (petite requête), d'où un intervalle un peu plus long.
  - nom: "Philibert"
    type: philibert
    domaine: "www.philibertnet.com"
    actif: true
    intervalle: 75

  # UltraJeux : lit la catégorie « ETB Coffret Dresseur d'Elite » Pokémon.
  # Pour d'autres catégories, copie leur adresse depuis le site :
  #   pages:
  #     - "https://www.ultrajeux.com/cat-0-4-505-pokemon-etb-coffret-dresseur-d-elite.html"
  #     - "https://www.ultrajeux.com/cat-0-4-515-pokemon-coffret-6-boosters.html"
  # Le lien de la notification ajoute directement l'article au panier.
  - nom: "UltraJeux"
    type: ultrajeux
    domaine: "www.ultrajeux.com"
    actif: true
    intervalle: 60

  # Cultura : aussi une marketplace. Les produits sont lus via l'API
  # publique de la boutique (celle qu'utilise la page de recherche).
  # Seules les offres vendues par Cultura comptent avec
  # vendeur_officiel_uniquement: true.
  - nom: "Cultura"
    type: cultura
    domaine: "www.cultura.com"
    actif: true
    intervalle: 60

  # Carrefour : aussi une marketplace. Protégé par Cloudflare : depuis une
  # connexion de particulier il répond le plus souvent, mais bloque par
  # moments. pokeget ne contourne pas ce blocage : il fait une pause et
  # réessaie. D'où un intervalle long (5 min). Ne marche pas depuis un
  # serveur (voir README).
  - nom: "Carrefour"
    type: carrefour
    domaine: "www.carrefour.fr"
    actif: true
    intervalle: 300

  # ----- Enseignes NON surveillées (anti-robot) -----
  # Fnac, King Jouet (DataDome), Amazon (AWS WAF), Cdiscount (Baleen),
  # Micromania et Pokémon Center (Imperva) bloquent les programmes
  # automatiques. pokeget ne cherche pas à contourner ces protections.

  # ----- Site générique « JSON-LD » (type: jsonld) -----
  # Fonctionne avec beaucoup de sites qui décrivent leurs produits au
  # format schema.org. On liste les fiches produit à surveiller :
  #   fiches: liste d'adresses de fiches produit (toujours surveillées)
  # Optionnel, pour découvrir de nouvelles fiches automatiquement :
  #   recherche:
  #     url: "https://exemple.fr/recherche?q={q}"   ({q} = le mot-clé)
  #     motif: "/produit/"   (morceau d'adresse que contient un lien de fiche)
  # Fonctionne notamment pour Play-In (www.play-in.com), JouéClub et
  # La Grande Récré : colle l'adresse de la fiche qui t'intéresse.
  # (Play-In interdit aux robots sa page de recherche : fiches uniquement.)
  - nom: "Play-In"
    type: jsonld
    actif: false
    intervalle: 60
    fiches:
      - "https://www.play-in.com/fr/produit/670423/booster-pokemon-30-ans-30th-celebration-m6a-cn"
